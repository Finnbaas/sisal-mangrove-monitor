<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sisal Mangrove Monitor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <!-- Leaflet (map library, from a CDN) for the two maps of the Ecosystem page (ecosystem.js) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <!-- styles: base.css first (colors, themes, layout, cards), then one file per screen; charts.css is shared by the storm and climate charts -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/points.css">
  <link rel="stylesheet" href="css/charts.css">
  <link rel="stylesheet" href="css/climatology.css">
  <link rel="stylesheet" href="css/stakeholders.css">
  <link rel="stylesheet" href="css/ecosystem.css">
  <link rel="stylesheet" href="css/method.css">
  <link rel="stylesheet" href="css/landing.css">
</head>
<body>
  <!-- Texts: every element with data-text="..." gets its text from content/texts.json (see content.js).
       Which pages and cards are shown is set in content/pages.json. -->
  <div id="page">

    <!-- TOP BAR: logo and name, then the page navigation (one link per page in content/pages.json, a divider and
         "Method"; built by content.js) -->
    <div id="topbar">
      <!-- the logo and the name link to the landing page (#home) -->
      <a id="brand" href="#home">
        <div id="brand-mark">S</div>
        <div id="brand-name" data-text="siteName"></div>
      </a>
      <nav id="subnav" aria-label="Pages"></nav>
      <div id="topbar-right"></div>
    </div>

    <!-- The research sections (one per page in content/pages.json) are built by content.js and placed
         here, before the card library. Each section has empty slots (data-slot="..."); when the section
         is shown, navigation.js moves the ready-made card with the same name (data-card="...") into each slot. -->

    <!-- CARD LIBRARY: every ready-made card exists only once, here. The names (data-card) are the
         names used in content/pages.json. -->
    <div id="card-library" hidden>

        <!-- coordinates of the selected point (filled by points.js): content.js moves this box into the sticky bar
             with the part links of a page that has parts with "showCoords" in content/pages.json (Ecosystem) -->
        <div id="coords" class="mono"></div>

        <div class="card" data-card="point-map">
          <div class="card-title-row top">
            <div>
              <div class="card-title" data-text="cardTitles.point-map"></div>
              <div class="faint" id="map-subtitle"></div>
            </div>
          </div>
          <!-- the legend strip sits under the map, like the storm map -->
          <div id="map-frame">
            <div id="map-view">
              <div id="map">
                <img id="map-image" src="img/site-map2.png" alt="">
                <div id="map-ring" hidden></div>
              </div>
            </div>
            <div id="legend">
              <span id="legend-title" data-text="labels.mapLegend"></span>
              <span id="legend-items"></span>
            </div>
          </div>
          <div id="map-basemap-switch" class="chip-row chip-row-small basemap-row"></div>
          <div class="fine" id="map-note"></div>
        </div>

        <div class="card" data-card="point-chart">
          <div class="card-title-row top">
            <div>
              <div class="card-title" id="point-name"></div>
              <div class="faint" id="point-class"></div>
            </div>
          </div>
          <div id="chips"></div>
          <!-- one chart per selected variable, a shared year axis and the comparison line (drawn by points.js
               with the chart parts of js/charts.js) -->
          <div id="chart" class="chart-stack"></div>
          <div id="chart-foot">
            <div class="faint xs" id="chart-summary"></div>
            <!-- card actions: the download icon opens a small menu; method.js adds the "Do this analysis
                 yourself" link here when a use case in content/method.json names this card -->
            <div id="exports" class="card-actions">
              <div class="download-wrap">
                <button id="download-toggle" class="icon-button" type="button" aria-haspopup="true" aria-expanded="false">
                  <svg class="icon" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 2V10.5M4.5 7.25L8 10.75L11.5 7.25M3 13.5H13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
                <div id="download-menu" class="download-menu" hidden>
                  <button id="export-csv" class="menu-item" type="button" data-text="labels.exportCsv"></button>
                  <button id="export-png" class="menu-item" type="button" data-text="labels.exportPng"></button>
                </div>
              </div>
            </div>
          </div>
          <div id="breakpoint-note" hidden></div>
          <p id="status" class="fine"></p>
        </div>

        <div class="card" data-card="point-description">
          <div class="card-title-row"><div class="card-title" data-text="cardTitles.point-description"></div></div>
          <!-- filled by points.js from the "description" of the selected point in content/featured-points.json -->
          <p id="point-description" class="placeholder-text"></p>
        </div>

        <!-- CLIMATOLOGY CARDS (filled by climatology-storms.js from data/events.json) -->

        <!-- storm map: drawn on the canvas by storm-map.js; the legend strip sits under the map -->
        <div class="card" data-card="storm-map">
          <div class="card-title-row"><div class="card-title" data-text="cardTitles.storm-map"></div></div>
          <div id="storm-map-frame">
            <div id="storm-map">
              <canvas id="storm-map-canvas"></canvas>
              <div id="storm-map-buttons">
                <button type="button" id="storm-map-zoom-in" class="map-button">+</button>
                <button type="button" id="storm-map-zoom-out" class="map-button">&minus;</button>
                <button type="button" id="storm-map-reset" class="map-button" data-text="stormMap.reset"></button>
              </div>
              <div id="storm-map-tip" class="hover-chip" hidden></div>
            </div>
            <div id="storm-map-legend"></div>
          </div>
          <p class="fine" id="storm-map-status"></p>
        </div>

        <!-- wave rose: drawn as SVG by wave-rose.js -->
        <div class="card" data-card="wave-direction">
          <div class="card-title-row"><div class="card-title" data-text="cardTitles.wave-direction"></div></div>
          <div id="wave-rose"><div id="wave-rose-tip" class="hover-chip" hidden></div></div>
          <div id="wave-rose-legend"></div>
          <p class="fine" id="wave-rose-note"></p>
          <p class="fine" id="wave-rose-status"></p>
        </div>

        <!-- all storms near Sisal as two bar charts: storm-counts.js -->
        <div class="card" data-card="storm-counts">
          <div class="card-title-row"><div class="card-title" data-text="cardTitles.storm-counts"></div></div>
          <div id="storm-counts-legend"></div>
          <div id="storm-counts-charts"><div id="storm-counts-tip" class="hover-chip" hidden></div></div>
          <p class="fine" id="storm-counts-text"></p>
          <p class="fine" id="storm-counts-note"></p>
          <p class="fine" id="storm-counts-status"></p>
        </div>

        <div class="card" data-card="event-list">
          <div class="card-title-row"><div class="card-title" data-text="cardTitles.event-list"></div></div>
          <div id="event-list"></div>
          <!-- how many events there are (climatology-storms.js) -->
          <div id="event-list-foot">
            <span id="event-list-note"></span>
          </div>
          <p class="fine" id="events-status"></p>
        </div>

        <div class="card" data-card="event-charts">
          <div id="event-charts-empty" data-text="messages.selectEvent"></div>
          <div id="event-charts-content" hidden>
            <div class="card-title-row top">
              <div>
                <div class="card-title" id="event-title"></div>
                <div class="faint" id="event-subtitle"></div>
              </div>
            </div>
            <!-- legend of the red box and dashed line in the charts (climatology-storms.js) -->
            <div id="event-legend"></div>
            <!-- one chart per event variable, the shared date axis and the comparison line (drawn by climatology-storms.js) -->
            <div id="event-charts"></div>
          </div>
        </div>

        <!-- CLIMATE AT SISAL (filled by climatology-climate.js). The charts are drawn like the storm charts above, from
             data/climate/typical-year.json (made by analysis/climatology/export_typical_year.py) -->

        <!-- the small card next to the heading of "Climate at Sisal": where the data comes from -->
        <div class="card climate-sources-card" data-card="climate-sources">
          <div class="card-title-row"><div class="card-title" data-text="labels.dataSourcesTitle"></div></div>
          <img src="img/climatology-data-cells.png" alt="">
        </div>

        <div class="card" data-card="climate-typical-year">
          <div class="card-title-row top">
            <div>
              <div class="card-title" data-text="cardTitles.climate-typical-year"></div>
              <div class="faint" data-text="labels.typicalYearSubtitle"></div>
            </div>
          </div>
          <!-- one chart per variable, one shared month axis and the comparison line (drawn by climatology-climate.js) -->
          <div id="typical-year-charts" class="chart-stack"></div>
          <p class="fine" id="typical-year-status"></p>
        </div>

        <div class="card" data-card="climate-change">
          <div class="card-title-row top">
            <div>
              <div class="card-title" data-text="cardTitles.climate-change"></div>
              <div class="faint" data-text="labels.changeSubtitle"></div>
            </div>
          </div>
          <div id="climate-change-charts" class="chart-stack">
            <p class="placeholder-text" data-text="messages.notYetAvailable"></p>
          </div>
          <p class="fine" id="climate-change-status"></p>
        </div>

        <!-- "In detail": one tab per variable; the charts in it are not filled yet (climatology-climate.js) -->
        <div class="card" data-card="climate-detail">
          <div class="card-title-row"><div class="card-title" data-text="cardTitles.climate-detail"></div></div>
          <div id="climate-detail-tabs" class="detail-tabs"></div>
          <div id="climate-detail-body"></div>
        </div>

        <!-- ECOSYSTEM CARDS (filled by ecosystem.js from data/vegetation/ and content/ecosystem.json).
             A <span class="placeholder-tag"> shows when the data of that card has "placeholder": true. -->

        <!-- Mangrove maps: the map with the layer switch, legend strip and opacity slider -->
        <div class="card" data-card="eco-map">
          <!-- the menu to choose the map, above the map it controls (ecosystem.js: renderMapMenu, content/ecosystem.json "mapMenu") -->
          <div id="eco-map-menu" class="map-menu"></div>
          <div class="card-title-row"><div class="card-title"><span id="eco-map-title"></span> <span class="placeholder-tag" hidden data-text="messages.placeholderTag"></span></div></div>
          <!-- a short label above the map, e.g. the storm of the acute views (layers.json "mapLabel") -->
          <p id="eco-map-label" class="fine" hidden></p>
          <div id="eco-map-frame" class="map-frame">
            <div id="eco-map" class="geo-map"></div>
            <div id="eco-map-message" class="map-message" hidden></div>
            <div class="map-buttons">
              <!-- base map black and white or colour (ecosystem.js: setupBasemapButton) -->
              <button type="button" id="eco-basemap-button" class="map-button"></button>
              <button type="button" id="eco-map-zoom-in" class="map-button"></button>
              <button type="button" id="eco-map-zoom-out" class="map-button"></button>
              <button type="button" id="eco-map-reset" class="map-button"></button>
            </div>
            <div id="eco-legend" class="legend-strip"></div>
          </div>
          <div id="eco-opacity-row" class="opacity-row">
            <span class="label-xs" id="eco-opacity-label"></span>
            <input type="range" id="eco-opacity" min="0" max="100" step="5">
            <span id="eco-opacity-value" class="opacity-value"></span>
          </div>
          <div class="card-actions card-actions-footer"><a id="eco-maps-link" class="eco-link"></a></div>
          <p class="fine" id="eco-map-status"></p>
        </div>

        <div class="card" data-card="eco-about">
          <div class="card-title-row"><div class="card-title"><span id="eco-about-title"></span> <span class="placeholder-tag" hidden data-text="messages.placeholderTag"></span></div></div>
          <div id="eco-about-body" class="about-body"></div>
        </div>

        <div class="card" data-card="eco-chart" hidden>
          <div class="card-title-row"><div class="card-title"><span id="eco-chart-title"></span> <span class="placeholder-tag" hidden data-text="messages.placeholderTag"></span></div></div>
          <div id="eco-chart-toggle" class="chip-row chip-row-small"></div>
          <div id="eco-chart-body" class="chart-stack"></div>
          <div id="eco-chart-legend" class="chart-legend"></div>
          <p id="eco-chart-note" class="about-text about-note"></p>
        </div>

        <div class="card" data-card="eco-source">
          <div class="card-title-row"><div class="card-title"><span id="eco-source-title"></span> <span class="placeholder-tag" hidden data-text="messages.placeholderTag"></span></div></div>
          <div id="eco-source-body"></div>
        </div>

        <!-- early warning signals, part 1: the verdict of the EWS notebook with its reason and the metrics table
             (filled by ecosystem.js) -->
        <div class="card" data-card="ews-verdict">
          <div class="card-title-row"><div class="card-title" data-text="cardTitles.ews-verdict"></div></div>
          <div id="ews-verdict-body"></div>
          <div class="chart-foot">
            <div></div>
            <div class="card-actions"><a id="eco-ews-link" class="eco-link"></a></div>
          </div>
          <p class="fine" id="eco-ews-status"></p>
        </div>

        <!-- "How to read this": general explanation of the early warning cards, four collapsible groups
             (filled by ecosystem.js from content/texts.json "ewsGuide") -->
        <div class="card" data-card="ews-guide">
          <div class="card-title-row"><div class="card-title" data-text="cardTitles.ews-guide"></div></div>
          <div id="ews-guide-body"></div>
        </div>

        <!-- early warning signals, part 2: rolling residual, AR1 and SD before the loss, one shared year axis -->
        <div class="card" data-card="ews-plots">
          <div class="card-title-row top">
            <div>
              <div class="card-title" data-text="cardTitles.ews-plots"></div>
              <div class="faint" id="ews-plots-subtitle"></div>
            </div>
          </div>
          <div id="ews-plots-charts" class="chart-stack"></div>
        </div>

        <!-- STAKEHOLDER CARDS (filled by stakeholders.js from content/stakeholders.json): the map of the chosen theme with the
             timeline under it (the theme tabs are at the top of the map card), and on the right the panel. The map uses the map classes of ecosystem.css. -->

        <div class="card" data-card="stakeholder-map">
          <!-- the theme tabs sit above the map they control (stakeholders.js: renderStakeholderMenu) -->
          <div id="sh-menu" class="card-tabs"></div>
          <div class="card-title-row top">
            <div>
              <div class="card-title" id="sh-title"></div>
              <div class="faint" id="sh-subtitle"></div>
            </div>
          </div>
          <div class="map-frame">
            <div id="sh-map" class="geo-map"></div>
            <div id="sh-map-message" class="map-message" hidden></div>
            <div class="map-buttons">
              <button type="button" id="sh-basemap" class="map-button"></button>
              <button type="button" id="sh-zoom-in" class="map-button"></button>
              <button type="button" id="sh-zoom-out" class="map-button"></button>
              <button type="button" id="sh-reset" class="map-button"></button>
            </div>
          </div>
          <div id="sh-legend" class="sh-legend"></div>
          <p class="fine" id="sh-status"></p>
        </div>

        <div class="card" data-card="stakeholder-time">
          <!-- top row: All years button, year display, one year back / forward -->
          <div id="sh-controls">
            <button id="sh-all-years" type="button" aria-pressed="true" data-text="stakeholders.allYears"></button>
            <div id="sh-year-block">
              <div class="label-xs" id="sh-year-label"></div>
              <div id="sh-year-big"></div>
            </div>
            <button id="sh-year-back" class="step" aria-label="Previous year">&larr;</button>
            <button id="sh-year-forward" class="step" aria-label="Next year">&rarr;</button>
          </div>
          <!-- the slider track is the time axis of the area rows under it: both use the same
               left and right edge (#sh-track and .sh-row-scale), and the handle line runs through all rows -->
          <div id="sh-time">
            <div id="sh-track">
              <div id="sh-track-line"></div>
              <div id="sh-track-years"></div>
              <input type="range" id="sh-slider" step="1" aria-label="Year">
            </div>
            <div id="sh-rows"></div>
            <div id="sh-handle"><div id="sh-handle-line"></div></div>
          </div>
          <div id="sh-certainty-legend"></div>
        </div>

        <div class="card" data-card="stakeholder-panel">
          <div class="card-title-row"><div class="card-title" data-text="stakeholders.panelTitle"></div></div>
          <div id="sh-panel-empty">
            <div id="sh-panel-empty-text"></div>
            <div id="sh-panel-note" hidden></div>
          </div>
          <div id="sh-panel-content" hidden></div>
        </div>
    </div>

    <!-- METHOD PAGE: built from content/method.json by method.js -->
    <section id="method" data-screen="method" hidden></section>
  </div>

  <!-- FOOTER (outside the screens, so it shows on every screen) -->
  <footer id="footer">
    <p data-text="footer.text"></p>
    <button id="footer-method-link" class="footer-link" type="button" data-text="footer.methodLink"></button>
  </footer>

  <!-- scripts: every file only defines functions, except main.js, which starts everything and comes last.
       The order matters: helpers.js and content.js are used by all others; charts.js by both climatology files. -->
  <script src="js/helpers.js"></script>
  <script src="js/content.js"></script>
  <script src="js/landing.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/points.js"></script>
  <script src="js/climatology-storms.js"></script>
  <script src="js/storm-map.js"></script>
  <script src="js/storm-counts.js"></script>
  <script src="js/wave-rose.js"></script>
  <script src="js/climatology-climate.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/ecosystem.js"></script>
  <script src="js/stakeholders.js"></script>
  <script src="js/method.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
