<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sisal Mangrove Monitor</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <header>
    <h1>Sisal Mangrove Monitor</h1>
    <p id="status">Loading point data&hellip;</p>
  </header>

  <main>
    <label for="point-select">Point</label>
    <select id="point-select"></select>

    <div id="chart-wrap">
      <canvas id="ndvi-chart"></canvas>
    </div>

    <div id="slider-wrap">
      <button id="year-back">&larr;</button>
      <input type="range" id="year-slider" min="1984" max="2026" step="1" value="2026">
      <button id="year-forward">&rarr;</button>
      <span id="year-readout"></span>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
